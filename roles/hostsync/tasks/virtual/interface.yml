---
- name: Build interface facts map
  loop: "{{ hostvars[hostsync_hostname]['ansible_facts']['interfaces'] | difference(['lo']) }}"
  loop_control:
    label: "{{ viface }}"
    loop_var: viface
  ansible.builtin.set_fact:
    _hostsync_viface_facts: >-
      {{
        (_hostsync_viface_facts | default({}))
        | combine({
            viface: (
              hostvars[hostsync_hostname]['ansible_facts'][(viface | replace('-', '_'))]
              | default({}, true)
            )
          })
      }}

- name: Debug all vifaces
  when:
    - ansible_check_mode | bool
  ansible.builtin.debug:
    var: _hostsync_viface_facts

- name: Derive ether and bridge iface lists from _hostsync_viface_facts
  ansible.builtin.set_fact:
    _hostsync_ether_ifaces: >-
      {{
        _hostsync_viface_facts | dict2items
        | selectattr('value.type','equalto','ether')
        | map(attribute='key')
        | reject('match', hostsync_interface_skip_regex)
        | list
      }}
    _hostsync_bridge_ifaces: >-
      {{
        _hostsync_viface_facts | dict2items
        | selectattr('value.type','equalto','bridge')
        | map(attribute='key')
        | reject('match', hostsync_interface_skip_regex)
        | list
      }}

- name: Derive missing interfaces
  ansible.builtin.set_fact:
    _hostsync_other_ifaces: >-
      {{
        _hostsync_viface_facts | dict2items
        | difference(_hostsync_ether_ifaces)
        | difference(_hostsync_bridge_ifaces)
        | list
      }}

- name: Create MAC Address for ether interfaces
  when:
    - hostsync_netbox_version is version(4.2, '>=')
  delegate_to: localhost
  loop: "{{ _hostsync_ether_ifaces }}"
  loop_control:
    label: "{{ viface_ether }}"
    loop_var: viface_ether
  netbox.netbox.netbox_mac_address:
    netbox_url: "{{ hostsync_netbox_api }}"
    netbox_token: "{{ hostsync_netbox_api_key }}"
    validate_certs: "{{ hostsync_netbox_validcert }}"
    data:
      mac_address: >-
        {{
          _hostsync_viface_facts[viface_ether].perm_macaddress
            | default(_hostsync_viface_facts[viface_ether].macaddress)
            | default(omit)
        }}
      tags: "{{ hostsync_add_tags }}"
    state: present

- name: Create ether interfaces in NetBox
  delegate_to: localhost
  loop: "{{ _hostsync_ether_ifaces }}"
  loop_control:
    label: "{{ viface_ether }}"
    loop_var: viface_ether
  netbox.netbox.netbox_vm_interface:
    netbox_url: "{{ hostsync_netbox_api }}"
    netbox_token: "{{ hostsync_netbox_api_key }}"
    validate_certs: "{{ hostsync_netbox_validcert }}"
    data:
      virtual_machine: "{{ hostsync_hostname }}"
      name: "{{ viface_ether }}"
      enabled: "{{ _hostsync_viface_facts[viface_ether].active | default(true) }}"
      mac_address: >-
        {{
          _hostsync_viface_facts[viface_ether].perm_macaddress
            | default(_hostsync_viface_facts[viface_ether].macaddress)
            | default(omit)
        }}
      primary_mac_address: >-
        {{
          omit if hostsync_netbox_version is version(4.2, '<') else
          _hostsync_viface_facts[viface_ether].perm_macaddress
            | default(_hostsync_viface_facts[viface_ether].macaddress)
            | default(omit)
        }}
      mtu: "{{ _hostsync_viface_facts[viface_ether].mtu | default(omit) }}"
      tags: "{{ hostsync_add_tags }}"
    state: present

- name: Create bridge interfaces
  delegate_to: localhost
  when:
    - (_hostsync_bridge_ifaces | length) > 0
  loop: "{{ _hostsync_bridge_ifaces }}"
  loop_control:
    label: "{{ viface_bridge }} -> {{ _parent | default('UNSET') }}"
    loop_var: viface_bridge
  vars:
    _parent: "{{ (netbox_bridge_parent_map[viface_bridge] | default(_default_bridge_parent)) }}"
  netbox.netbox.netbox_vm_interface:
    netbox_url: "{{ hostsync_netbox_api }}"
    netbox_token: "{{ hostsync_netbox_api_key }}"
    validate_certs: "{{ hostsync_netbox_validcert }}"
    data:
      virtual_machine: "{{ hostsync_hostname }}"
      name: "{{ viface_bridge }}"
      enabled: "{{ _hostsync_viface_facts[viface_bridge].active | default(true) }}"
      mtu: "{{ _hostsync_viface_facts[item].mtu | default(omit) }}"
      tags: "{{ hostsync_add_tags }}"
    state: present
